<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5eb">
  <title>123 小花园 · Math Garden</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app/styles.css">
  <link rel="stylesheet" href="./app/shapes.css">
  <link rel="stylesheet" href="./app/patterns.css">
  <script src="./app/shapes.js" defer></script>
  <script src="./app/patterns.js" defer></script>
  <script src="./app/choice-game.js" defer></script>
  <script src="./app/counting.js" defer></script>
  <script src="./app/preferences.js" defer></script>
  <script src="./app/voice.js" defer></script>
  <script src="./app/shell.js" defer></script>
  <script src="./app/offline.js" defer></script>
  <script src="./app/garden-ui.js" defer></script>
  <script src="./app/main.js" defer></script>
</head>
<body>
  <header class="garden-bar" data-garden-page="home"></header>
  <main class="garden">
    <section id="home" aria-labelledby="home-title">
      <header class="garden-page-header">
        <div class="garden-page-heading"><p class="garden-page-kicker">花园日常</p><h1 id="home-title" tabindex="-1">今天，也来玩数学。</h1></div>
        <p class="garden-page-note"><span aria-hidden="true">✳</span> 从一个小发现开始</p>
      </header>
      <section class="welcome" aria-labelledby="welcome-title">
        <div>
          <h2 class="garden-feature-title" id="welcome-title">从一朵花开始，<br>发现数学的办法。</h2>
          <p class="welcome-copy">先动动手，再用图和数字说清楚。</p>
          <a class="garden-course-link primary" href="./course.html" aria-label="开始学数学">开始学数学 <span aria-hidden="true">→</span></a>
        </div>
        <img class="welcome-art" src="./assets/garden-hero.svg" alt="" width="420" height="300">
      </section>
      <section class="game-shelf" id="games" aria-labelledby="games-title">
        <div class="game-shelf-header">
          <div class="garden-page-heading"><p class="garden-page-kicker">小游戏架</p><h2 id="games-title" tabindex="-1">数学游戏</h2></div>
          <button id="garden-sound" class="secondary" type="button" aria-label="声音" aria-pressed="true">
            声音 <span aria-hidden="true">开</span>
          </button>
        </div>
        <div class="activities">
          <button id="start-counting" class="activity" type="button" aria-labelledby="count-name" aria-describedby="count-copy">
            <span class="activity-copy">
              <strong id="count-name">数一数</strong>
              <small id="count-copy">点点花朵，看看一共有几朵。</small>
              <span class="activity-action" aria-hidden="true">去数花朵 →</span>
            </span>
            <span class="activity-art activity-numbers" aria-hidden="true">123</span>
          </button>
          <button id="start-shapes" class="activity" type="button" aria-labelledby="shapes-name" aria-describedby="shapes-copy">
            <span class="activity-copy">
              <strong id="shapes-name">图形找朋友</strong>
              <small id="shapes-copy">给圆形、三角形和正方形找座位。</small>
              <span class="activity-action" aria-hidden="true">去找图形 →</span>
            </span>
            <svg class="activity-art" aria-hidden="true" viewBox="0 0 76 62">
              <circle cx="25" cy="22" r="14" fill="#d9a484"/>
              <path d="m45 8 20 34H25Z" fill="#e5bd6d" stroke="#f6efdc" stroke-width="2"/>
              <rect x="45" y="32" width="23" height="23" rx="3" fill="#9fac86" stroke="#f6efdc" stroke-width="2"/>
            </svg>
          </button>
          <button id="start-patterns" class="activity" type="button" aria-labelledby="patterns-name" aria-describedby="patterns-copy">
            <span class="activity-copy">
              <strong id="patterns-name">接着排一排</strong>
              <small id="patterns-copy">顺着花叶小路，找找下一格。</small>
              <span class="activity-action" aria-hidden="true">去排小路 →</span>
            </span>
            <svg class="activity-art" aria-hidden="true" viewBox="0 0 76 62">
              <path d="M28 45C25 23 34 13 57 13c0 20-10 33-29 32Z" fill="#93aa84"/>
              <path d="M29 44C15 45 7 36 8 24c15-2 23 7 21 20Z" fill="#b6c5a1"/>
              <path d="M27 53c2-12 10-21 20-29" fill="none" stroke="#54785c" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="63" cy="46" r="5" fill="#d8a1ab"/>
            </svg>
          </button>
        </div>
      </section>
    </section>

    <section id="counting" aria-labelledby="counting-title" hidden>
      <button id="back-home" class="secondary" type="button"><span aria-hidden="true">←</span> 回花园</button>
      <div class="demo">
        <h1 id="counting-title" tabindex="-1">数一数</h1>
        <p class="game-progress" hidden></p>
        <p id="counting-status" role="status"></p>
        <div id="flower-bed" class="choices" aria-label="花坛" role="group">
          <button type="button" aria-label="第 1 朵花" aria-pressed="false"><img src="./assets/count-flower.svg" alt="" width="42" height="42"></button>
          <button type="button" aria-label="第 2 朵花" aria-pressed="false"><img src="./assets/count-flower.svg" alt="" width="42" height="42"></button>
          <button type="button" aria-label="第 3 朵花" aria-pressed="false"><img src="./assets/count-flower.svg" alt="" width="42" height="42"></button>
          <button type="button" aria-label="第 4 朵花" aria-pressed="false" hidden><img src="./assets/count-flower.svg" alt="" width="42" height="42"></button>
          <button type="button" aria-label="第 5 朵花" aria-pressed="false" hidden><img src="./assets/count-flower.svg" alt="" width="42" height="42"></button>
        </div>
        <div id="answers" class="choices" aria-label="选一选总数" role="group" hidden>
          <button type="button">2</button>
          <button type="button">3</button>
          <button type="button">4</button>
        </div>
        <button id="count-hear" class="secondary game-hear" type="button" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M3 9h4l5-4v14l-5-4H3zM16 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/>
          </svg>
          听题目
        </button>
        <button id="help-counting" class="secondary" type="button" hidden>帮帮我</button>
        <button id="begin-counting" class="primary" type="button" hidden>开始练习</button>
        <button id="count-switch" class="secondary" type="button" hidden>换个游戏</button>
        <button id="next-counting" class="primary" type="button" hidden>下一题</button>
        <button id="skip-demo" class="secondary" type="button">跳过示范</button>
        <button id="replay-demo" class="secondary" type="button" hidden>再看示范</button>
      </div>
    </section>
    <section id="choice-game" aria-labelledby="choice-title" hidden>
      <button id="choice-back" class="secondary" type="button"><span aria-hidden="true">←</span> 回花园</button>
      <div class="demo">
        <h1 id="choice-title" tabindex="-1"></h1>
        <p class="game-progress" hidden></p>
        <p role="status"></p>
        <div id="choice-board"></div>
        <div id="choice-options" class="choices" aria-label="选一选" role="group">
          <button type="button"></button>
          <button type="button"></button>
          <button type="button"></button>
        </div>
        <button id="choice-hear" class="secondary game-hear" type="button" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M3 9h4l5-4v14l-5-4H3zM16 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/>
          </svg>
          听题目
        </button>
        <button id="choice-help" class="secondary" type="button">帮帮我</button>
        <button id="choice-skip" class="secondary" type="button">跳过示范</button>
        <button id="choice-begin" class="primary" type="button" hidden>开始练习</button>
        <button id="choice-switch" class="secondary" type="button" hidden>换个游戏</button>
        <button id="choice-next" class="primary" type="button" hidden>下一题</button>
        <button id="choice-replay" class="secondary" type="button" hidden>再看示范</button>
      </div>
    </section>
  </main>
</body>
</html>
