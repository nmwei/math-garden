<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5eb">
  <title>家长小角 · 123 小花园</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app/styles.css">
  <link rel="stylesheet" href="./app/parent.css">
  <script src="./app/preferences.js" defer></script>
  <script src="./app/voice.js" defer></script>
  <script src="./app/shell.js" defer></script>
  <script src="./app/offline.js" defer></script>
  <script src="./app/parent.js" defer></script>
</head>
<body>
  <header class="garden-bar" data-garden-page="parent"></header>
  <main class="garden parent-main">
    <header class="garden-page-header">
      <div class="garden-page-heading">
        <p class="garden-page-kicker">家长小角</p>
        <h1>家长中心</h1>
      </div>
      <p class="garden-page-note"><span aria-hidden="true">✳</span> 陪孩子慢慢学</p>
    </header>
    <div class="parent-panels">
      <section class="parent-panel parent-voice" aria-labelledby="voice-title">
        <h2 id="voice-title">设备声音</h2>
        <p>开启后可听题、报数和试听。关闭后会隐藏听题与试听按钮，仍可看图和文字继续练习。</p>
        <button id="parent-sound" type="button" aria-pressed="true">练习声音 <span aria-hidden="true">开</span></button>
        <label for="parent-voice-select">普通话声音</label>
        <div class="parent-actions">
          <select id="parent-voice-select" aria-describedby="voice-support">
            <option value="">自动选择普通话声音</option>
          </select>
          <button id="preview-voice" type="button">试听声音</button>
        </div>
        <p class="parent-note" id="voice-support">声音来自设备。断网时能否朗读，取决于设备上是否已有可离线用的声音。</p>
        <p class="parent-status" id="voice-status" role="status"></p>
      </section>
      <section class="parent-panel" aria-labelledby="offline-title">
        <h2 id="offline-title">离线使用</h2>
        <p>首次联网打开时，会自动保存课程、小游戏和图示。准备好后即可离线练习。</p>
        <p class="parent-status" data-offline-status role="status">正在准备离线资源…</p>
        <button id="prepare-offline" type="button" hidden>重新准备离线</button>
        <p class="parent-note">在 iPad 上，可用 Safari 的分享菜单把小花园添加到主屏幕。</p>
      </section>
      <section class="parent-panel" aria-labelledby="update-title">
        <h2 id="update-title">应用更新</h2>
        <p>联网时可以检查新版本。有新版时，重新加载页面即可更新，已保存的练习记录和设置会保留。</p>
        <p class="parent-note">当前版本 <strong data-current-version>待确认</strong></p>
        <div class="parent-actions">
          <button id="check-update" type="button" disabled>检查更新</button>
          <button id="reload-page" class="secondary" type="button">重新加载页面</button>
        </div>
        <p class="parent-status" data-update-status role="status"></p>
      </section>
    </div>
  </main>
</body>
</html>
